<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tudo É Terapêutico — Guia Prático de Recuperação</title>
  
  <meta name="description" content="Guia Prático de Recuperação em Dependência Química por Weverton Ramalho e Pedro Filipe Pez.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #080808;
      --card-bg: #121212;
      --border-color: #262626;
      --accent-red: #e50914;
      --accent-red-hover: #b80710;
      --accent-green: #00ff88;
      --text-main: #f3f3f3;
      --text-muted: #a3a3a3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, #2a0a0c 0%, #080808 70%);
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .top-bar {
      background: linear-gradient(90deg, #b80710 0%, #e50914 50%, #b80710 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 16px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .main-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 16px 60px 16px;
    }

    .hero-badge {
      display: inline-block;
      background-color: rgba(229, 9, 20, 0.15);
      border: 1px solid rgba(229, 9, 20, 0.4);
      color: #ff4d4d;
      font-weight: 800;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 6px 12px;
      border-radius: 6px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 900;
      line-height: 1.25;
      color: #ffffff;
      margin-bottom: 16px;
      text-align: center;
    }

    .highlight-red {
      color: var(--accent-red);
      text-decoration: underline;
      text-decoration-color: rgba(229, 9, 20, 0.4);
      text-underline-offset: 4px;
    }

    .hero-sub {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.98rem;
      margin-bottom: 24px;
    }

    .mockup-wrapper {
      position: relative;
      text-align: center;
      margin: 20px 0 28px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mockup-glow {
      position: absolute;
      width: 80%;
      height: 80%;
      background: radial-gradient(circle, rgba(229, 9, 20, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(20px);
      z-index: 0;
      pointer-events: none;
    }

    .mockup-img {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      height: auto;
      filter: drop-shadow(0 20px 35px rgba(0,0,0,0.95)) drop-shadow(0 0 30px rgba(229,9,20,0.3));
      transition: transform 0.3s ease;
    }

    .mockup-img:hover {
      transform: scale(1.02);
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 4px 20px rgba(229, 9, 20, 0.4); }
      50% { box-shadow: 0 4px 30px rgba(229, 9, 20, 0.7); }
      100% { box-shadow: 0 4px 20px rgba(229, 9, 20, 0.4); }
    }

    .cta-btn {
      display: block;
      width: 100%;
      background-color: var(--accent-red);
      color: #ffffff;
      font-weight: 800;
      font-size: 1.05rem;
      text-align: center;
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 12px;
      animation: pulseGlow 2.5s infinite;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .cta-btn:hover {
      background-color: var(--accent-red-hover);
      transform: translateY(-2px);
    }

    .security-badges-container {
      margin-top: 14px;
      text-align: center;
    }

    .security-tags {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .badge-pill {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 0.72rem;
      color: #b0b0b0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }

    .payment-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .kiwify-badge {
      background-color: #12b76a;
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      margin: 28px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      border-left: 4px solid var(--accent-red);
      padding-left: 12px;
      margin-bottom: 14px;
    }

    p {
      color: #d4d4d4;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    p:last-child {
      margin-bottom: 0;
    }

    .feature-list {
      list-style: none;
    }

    .feature-list li {
      position: relative;
      padding-left: 28px;
      margin-bottom: 12px;
      color: #d4d4d4;
      font-size: 0.95rem;
    }

    .feature-list li::before {
      content: "✓";
      position: absolute;
      left: 0;
      color: var(--accent-red);
      font-weight: 800;
    }

    .bonus-card {
      background: linear-gradient(135deg, #1c0d0e 0%, #121212 100%);
      border: 1px solid rgba(229, 9, 20, 0.4);
      border-radius: 16px;
      padding: 24px;
      margin: 28px 0;
    }

    .bonus-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .bonus-tag {
      background-color: var(--accent-red);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .bonus-value {
      color: var(--accent-green);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .bonus-flex {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .bonus-logo {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(229, 9, 20, 0.4);
      flex-shrink: 0;
    }

    .format-card {
      border: 1px solid rgba(229, 9, 20, 0.4) !important;
      background: linear-gradient(180deg, #181818 0%, #121212 100%);
      position: relative;
    }

      border: 1px solid rgba(229
